<!doctype html><html><head><meta charset="utf-8"><style>
/* MODELO DE REELS – PLACAR ANIMADO (Justo Acordo). 10 s. Trocar só os números marcados com "TROCAR". */
@font-face{font-family:Cabin;font-weight:400;src:url('../../gerador/fonts/cabin-latin-400-normal.woff2')}
@font-face{font-family:Cabin;font-weight:600;src:url('../../gerador/fonts/cabin-latin-600-normal.woff2')}
@font-face{font-family:Cabin;font-weight:700;src:url('../../gerador/fonts/cabin-latin-700-normal.woff2')}
@font-face{font-family:Corm;font-weight:600;src:url('../../gerador/fonts/cormorant-garamond-latin-600-normal.woff2')}
:root{--terra:#A45248;--verde:#1C4220;--areia:#F7F1EC;--rosa:#EACBBB;--rosa2:#CA9A8E;--ink:#3B2F2C}
html,body{margin:0}
#r{width:1080px;height:1920px;background:var(--terra);position:relative;overflow:hidden;font-family:Cabin,sans-serif;color:#fff;font-variant-numeric:lining-nums}
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes simb{from{opacity:0;transform:translateX(160px) rotate(-8deg)}to{opacity:.16;transform:none}}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-60px)}}
@keyframes roll{from{transform:translateY(0)}}
@keyframes cnt{from{--n:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(234,203,187,0)}50%{box-shadow:0 0 0 18px rgba(234,203,187,.25)}}

.simb{position:absolute;right:-200px;top:560px;height:1500px;opacity:0;animation:simb 1.4s .1s cubic-bezier(.2,.8,.2,1) both}
.simbw{position:absolute;inset:0;animation:drift 10s linear both}
.logo{position:absolute;left:96px;top:150px;width:430px;animation:left .7s .2s cubic-bezier(.2,.8,.2,1) both}
.kicker{position:absolute;left:96px;top:420px;font-size:34px;font-weight:600;letter-spacing:8px;color:var(--rosa);animation:fade .6s .8s both}

/* odômetro do valor: cada dígito é uma coluna 0-9 que rola até o número */
.valor{position:absolute;left:90px;top:480px;display:flex;align-items:flex-end;font-family:Corm;font-weight:600;font-size:230px;line-height:1;animation:fade .3s 1.1s both}
.valor .t{display:block}
.d{display:inline-block;height:230px;overflow:hidden;vertical-align:bottom}
.d span{display:flex;flex-direction:column;animation:roll 2.1s cubic-bezier(.15,.85,.25,1) both}
.d span b{display:block;height:230px;font-weight:600}
.d1 span{transform:translateY(-230px);animation-delay:1.1s}   /* TROCAR: -230px x dígito (1) */
.d2 span{transform:translateY(-1380px);animation-delay:1.3s}  /* TROCAR: -230px x dígito (6) */
.suf{position:absolute;left:96px;top:735px;font-family:Corm;font-weight:600;font-size:120px;line-height:1;animation:up .7s 3.1s cubic-bezier(.2,.8,.2,1) both}
.uline{position:absolute;left:96px;top:905px;width:170px;height:8px;background:var(--rosa);transform-origin:left;animation:line .6s 3.6s both}
.texto{position:absolute;left:96px;top:950px;width:860px;font-size:54px;line-height:1.28;animation:up .7s 3.8s cubic-bezier(.2,.8,.2,1) both}

.card{position:absolute;left:72px;right:72px;top:1250px;height:420px;border-radius:34px;background:var(--areia);color:var(--ink);box-sizing:border-box;padding:50px 56px;animation:up .8s 4.7s cubic-bezier(.2,.8,.2,1) both}
.nums{display:flex;gap:90px}
.nums p{margin:0}
.big{font-family:Corm;font-weight:600;font-size:130px;line-height:1;color:var(--verde)}
.c1{animation:cnt 1.6s 5.1s cubic-bezier(.2,.8,.2,1) both;counter-reset:n var(--n)}
.c2{animation:cnt 1.4s 5.4s cubic-bezier(.2,.8,.2,1) both;counter-reset:n var(--n)}
.c1::after,.c2::after{content:counter(n)}
.c1{--alvo:210}.c2{--alvo:20}
.lab{font-size:32px;margin-top:6px}
.sep{height:3px;background:var(--rosa);margin:34px 0 28px;transform-origin:left;animation:line .6s 6.4s both}
.selo{font-size:34px;line-height:1.35;animation:fade .6s 6.7s both}
.selo b{color:var(--terra)}
.badge{position:absolute;right:46px;top:-34px;padding:16px 32px;border-radius:999px;background:var(--verde);color:#fff;font-size:28px;font-weight:700;letter-spacing:4px;opacity:0;
  animation:pop .5s 7.2s cubic-bezier(.3,1.6,.5,1) both, glow 1.2s 7.8s ease-in-out 2}
.foot{position:absolute;left:96px;right:96px;bottom:110px;display:flex;justify-content:space-between;align-items:center;font-size:30px;color:rgba(255,255,255,.85);animation:fade .6s 7.9s both}
.foot b{font-size:26px;letter-spacing:4px;color:var(--rosa)}
</style></head><body>
<div id="r">
  <div class="simbw"><img class="simb" src="../../gerador/assets/simb_terra.png"></div>
  <img class="logo" src="../../gerador/assets/logo_branco.png">
  <div class="kicker">PLACAR JUSTO ACORDO</div>
  <div class="valor"><span class="t">R$&nbsp;</span>
    <span class="d d1"><span><b>0</b><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b></span></span><span class="t">,</span>
    <span class="d d2"><span><b>0</b><b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b></span></span></div>
  <div class="suf">milhão</div>
  <div class="uline"></div>
  <div class="texto">já voltaram ao caixa das empresas que confiam na Justo Acordo.</div>
  <div class="card"><div class="badge">100% NO ÊXITO</div>
    <div class="nums">
      <div><p class="big c1" style="--n:210"></p><p class="lab">acordos firmados</p></div>   <!-- TROCAR -->
      <div><p class="big c2" style="--n:20"></p><p class="lab">empresas credoras</p></div>   <!-- TROCAR -->
    </div>
    <div class="sep"></div>
    <div class="selo">Cobrança extrajudicial <b>100% no êxito</b>:<br>só recebemos quando o devedor paga.</div>
  </div>
  <div class="foot"><span>justoacordo.com.br</span><b>RECUPERAÇÃO DE CRÉDITO</b></div>
</div></body></html>
